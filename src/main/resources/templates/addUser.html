<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add User</title>
</head>

<body>

    <h1>Add New User</h1>

    <form th:action="@{/admin/saveUser}"
          th:object="${user}"
          method="post">

        <input type="text"
               th:field="*{name}"
               placeholder="Name">

        <br><br>

        <input type="email"
               th:field="*{email}"
               placeholder="Email">

        <br><br>

        <input type="password"
               th:field="*{password}"
               placeholder="Password">

        <br><br>

        <input type="text"
               th:field="*{phoneno}"
               placeholder="Phone Number">

        <br><br>

        <button type="submit">
            Add User
        </button>

    </form>

</body>

</html>
