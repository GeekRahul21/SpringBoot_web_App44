<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login Page</title>

<link rel="stylesheet" th:href="@{/css/login.css}">

</head>
<body>

	<h2>Login Here</h2>
	
	
	<div th:if="${successMsg}">

		<h3 style="color:green;" th:text="${successMsg}"></h3>

	</div>


	<div th:if="${errorMsg}">

		<h3 style="color: red;" th:text="${errorMsg}"></h3>

	</div>

	<form th:action="@{/LoginForm}" th:object="${user}" method="post">

		Email : <input type="text" th:field="*{email}" /> <br> <br>
		Password : <input type="password" th:field="*{password}" /> <br>
		<br> <input type="submit" value="Login" /> <br> <br>
		Registerd here.........<a href="regPage">Register</a> <br>
		<br> <a href="index.html">Home Page</a>
	</form>

</body>
</html>
