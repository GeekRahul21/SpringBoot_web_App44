<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>
    
    <link rel="stylesheet" th:href="@{/css/adminEditUser.css}">

</head>

<body>

    <h1>Edit Profile</h1>

    <form action="/admin/updateProfile" method="post">

        <!-- User ID -->
        <input type="hidden"
               name="id"
               th:value="${user.id}">


        <!-- Name -->
        <label>Name:</label>
        <input type="text"
               name="name"
               th:value="${user.name}"
               required>

        <br><br>


        <!-- Email -->
        <label>Email:</label>
        <input type="email"
               name="email"
               th:value="${user.email}"
               required>

        <br><br>


        <!-- Password -->
        <label>Password:</label>
        <input type="password"
               name="password"
               th:value="${user.password}"
               required>

        <br><br>


        <!-- Phone Number -->
        <label>Phone Number:</label>
        <input type="text"
               name="phoneno"
               th:value="${user.phoneno}"
               required>

        <br><br>


        <button type="submit">Update</button>

    </form>

</body>

</html>
